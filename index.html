<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eraseddata403</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 20%, #291326 0%, transparent 38%),
        linear-gradient(180deg, #080708 0%, #110b10 55%, #000000 100%);
      color: #e8e3e6;
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.12;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(255,255,255,0.08) 3px
        );
      animation: flicker 7s infinite;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 28px;
    }

    .poem {
      max-width: 520px;
      width: 100%;
      font-size: clamp(20px, 5vw, 30px);
      line-height: 1.75;
      letter-spacing: 0.03em;
      text-shadow: 0 0 18px rgba(255,255,255,0.10);
      animation: appear 4s ease forwards;
    }

    .poem p {
      margin: 0 0 32px;
    }

    .signature {
      margin-top: 55px;
      font-family: monospace;
      font-size: 11px;
      letter-spacing: 0.25em;
      opacity: 0.35;
    }

    @keyframes appear {
      from {
        opacity: 0;
        filter: blur(8px);
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
    }

    @keyframes flicker {
      0%, 94%, 100% { opacity: 0.12; }
      95% { opacity: 0.22; }
      96% { opacity: 0.07; }
      97% { opacity: 0.18; }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="poem">

      <p>
        Walking between what’s real<br>
        wonder if it’s a dream
      </p>

      <p>
        conclusions are insufficient<br>
        based on hierarchy
      </p>

      <p>
        there’s always a new beginning<br>
        revelations
      </p>

      <p>
        conventionality’s a killer<br>
        I’m absurd<br>
        absorbed by fantasies
      </p>

      <p>
        yet I’m alive<br>
        in a sea of the dead
      </p>

      <div class="signature">
        eraseddata403
      </div>

    </div>
  </main>
</body>
</html>
